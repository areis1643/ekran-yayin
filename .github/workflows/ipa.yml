name: ipa
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Proje üret
        run: brew install xcodegen && xcodegen generate
      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild -project Ekran.xcodeproj -scheme Ekran -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build build | tail -60
      - name: IPA paketle
        run: |
          app=build/Build/Products/Release-iphoneos/Ekran.app
          ls "$app/PlugIns"
          mkdir Payload && cp -R "$app" Payload/
          zip -qry Ekran.ipa Payload
          ls -la Ekran.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: Ekran.ipa
